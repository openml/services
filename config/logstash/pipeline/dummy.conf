input {
  jdbc {
    jdbc_driver_library => "/usr/share/java/mysql-connector-j.jar"
    jdbc_driver_class => "com.mysql.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://openml-test-database:3306/es_db"
    jdbc_user => "${JDBC_MYSQL_USER}"
    jdbc_password => "${JDBC_MYSQL_PASSWORD}"
    jdbc_paging_enabled => true
    tracking_column => "unix_ts_in_secs"
    use_column_value => true
    tracking_column_type => "numeric"
    schedule => "*/1 * * * * *"
    statement_filepath => "/usr/share/logstash/pipeline/queries/study.sql"
  }
}
filter {
  mutate {
    copy => { "id" => "[@metadata][_id]"}
    remove_field => ["id", "@version", "unix_ts_in_secs"]
  }
}
output {
  stdout { codec =>  "rubydebug"}
}
