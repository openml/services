# Adds the task count metadata to the task type index
input {
  jdbc {
    jdbc_driver_library => "/usr/share/java/mysql-connector-j.jar"
    jdbc_driver_class => "com.mysql.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://openml-test-database:3306/openml_expdb"
    jdbc_user => "${JDBC_MYSQL_USER}"
    jdbc_password => "${JDBC_MYSQL_PASSWORD}"
    jdbc_paging_enabled => true
    statement_filepath => "/usr/share/logstash/pipeline/task_type/queries/task_type_inout.sql"
    parameters => { 
      "task_type_id_from" => "${ID_FROM:1}" 
      "task_type_id_to" => "${ID_TO:10000}" 
      }
  }
}
filter {
  aggregate {
    task_id => "%{tt_id}"
    code => "
    map['task_type_id'] ||= event.get('tt_id')
    map['inputs'] ||= []
    map['inputs'] << {'name' => event.get('name')}
    event.cancel()
    "
    push_previous_map_as_event => true
  }
  mutate {
    rename => { "tt_id" => "[@metadata][_id]" }
    remove_field => {"io"}
  }
}
output {
  stdout { codec =>  "rubydebug"}
  elasticsearch {
    action => "update"
    index => "task_type"
    document_id => "%{[@metadata][_id]}"
    hosts => ["${ELASTICSEARCH_HOST}"]
  }
}
