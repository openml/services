# Creates the task type documents with basic metadata.
input {
  jdbc {
    jdbc_driver_library => "/usr/share/java/mysql-connector-j.jar"
    jdbc_driver_class => "com.mysql.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://openml-test-database:3306/openml_expdb"
    jdbc_user => "${JDBC_MYSQL_USER}"
    jdbc_password => "${JDBC_MYSQL_PASSWORD}"
    jdbc_paging_enabled => true
    statement_filepath => "/usr/share/logstash/pipeline/task_type/queries/task_type.sql"
  }
}
filter {
  mutate {
    rename => { "creationDate" => "date" }
    copy => { "tt_id" => "[@metadata][_id]" }
  }
  mutate {
    remove_field => ["creator", "contributors"]
  }
}
output {
  stdout { codec =>  "rubydebug"}
}
