services:
  x-php-image: &php-image
    image: openml/php-rest-api:v1.3.2
    env_file: config/php/.env

  database:
    image: "mysql:9.5.0-oraclelinux9"
    container_name: "openml-database"
    ports:
      - "3306:3306"
    command: --innodb-buffer-pool-size=16G
    env_file: config/database/.env
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      start_period: 30s
      start_interval: 1s
      timeout: 3s
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 32G

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23  # This version is not available on arm. Newer version do not play well with the PHP code. See https://github.com/openml/OpenML/tree/feature/elasticsearch8
    container_name: "openml-elasticsearch"
    platform: "linux/amd64"
    ports:
      - "9200:9200"  # also known as /es (nginx)
      - "9300:9300"
    env_file: config/elasticsearch/.env
    volumes:
      - /data/openml-storage/openml/mysql:/var/lib/mysql
    healthcheck:
      test: curl -A "healthcheck" 127.0.0.1:9200/_cluster/health | grep -e "green"
      start_period: 30s
      start_interval: 5s
      timeout: 3s
      interval: 10s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 64G

  elasticsearch-indexer:
    profiles: ["all", "object-storage", "rest-api", "frontend", "elasticsearch", "evaluation-engine"]
    <<: *php-image
    container_name: "openml-elasticsearch-indexer"
    environment:
      ES_ENABLED: true
      INDEX_ES: true
    depends_on:
      elasticsearch:
        condition: service_healthy
      database-setup:
        condition: service_completed_successfully

  nginx:
    profiles: ["all", "client-ci", "object-storage", "rest-api", "frontend", "elasticsearch", "evaluation-engine"]
    build:
      context: config/nginx
    volumes:
      - /data/openml-storage/openml/nginx/shared.conf:/etc/nginx/shared.conf
      - /data/openml-storage/openml/nginx/conf.d:/etc/nginx/conf.d
      - /data/openml-storage/openml/certbot/www:/var/www/certbot/
      - /data/openml-storage/openml/certbot/conf/:/etc/nginx/ssl/
      - ./logs/nginx:/var/log/nginx
    container_name: openml-nginx
    ports:
      - "80:80"
      - "443:443"

  certbot:
    profiles: [certbot]
    image: certbot/certbot:latest
    volumes:
      - /data/openml-storage/openml/certbot/www/:/var/www/certbot/
      - /data/openml-storage/openml/certbot/conf/:/etc/letsencrypt/

  php-api:
    <<: *php-image
    container_name: "openml-php-rest-api"
    ports:
      - "8080:80"  # also known as /api (nginx)
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - /data/openml-storage/openml/php:/var/www/data
    # Healthcheck (and multiple depends_on: php-api) disabled, so that it also spins up before the data is uploaded.
    #healthcheck:
      #test: curl 127.0.0.1:80/api/v1/json/data/1 | grep -e "data_set_description"
      #start_period: 30s
      #start_interval: 5s
      #timeout: 3s
      #interval: 1m
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 16G

  frontend:
    image: openml/frontend:v2.1.10
    container_name: "openml-frontend"
    ports:
      - "8081:5000"  # also known as / (nginx)
    env_file: config/frontend/.env

  object-storage:
    image: chrislusf/seaweedfs:4.48
    container_name: "openml-object-storage"
    ports:
      - "8333:8333"  # also known as /s3 (nginx)
      - "8888:8888"
    env_file: config/object-storage/.env

  croissants:
    profiles: ["all"]
    image: "openml/croissant-converter:v1.5.0"
    container_name: "openml-croissant-converter"
    env_file: config/croissant-converter/.env
    ports:
      - "8001:8001"
    command: >
      web_api.py --host "0.0.0.0" --port 8001 --s3-server http://object-storage:8333/


networks:
  default:
    name: openml-services
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.1.0/24

